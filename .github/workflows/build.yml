name: Build Clean Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Назва додатку'
        required: true
        default: 'My HTML Game'
      package_id:
        description: 'ID Пакету'
        required: true
        default: 'com.custom.htmlgame'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 1. Встановлюємо JDK 17, яка необхідна для Gradle 8.x та Cordova Android 13
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. ПРИМУСОВО встановлюємо стабільну версію Gradle 8.7 у систему, перекриваючи Gradle 9
    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Prepare HTML Files
      run: |
        mkdir -p src_content
        unzip -o app.zip -d src_content/

    - name: Create Cordova Project & Configure
      run: |
        # Створюємо чистий проект
        cordova create build_tmp "${{ github.event.inputs.package_id }}" "${{ github.event.inputs.app_name }}"
        cd build_tmp
        
        # Використовуємо СВІЖУ версію cordova-android 13.0.0 (вона сумісна з JDK 17 та Gradle 8)
        cordova platform add android@13.0.0
        
        # Переносимо файли вебри
        rm -rf www/*
        cp -r ../src_content/* www/
        
        if [ -f "../icon.png" ]; then
          cp ../icon.png www/icon.png
        fi

    # 3. Виправляємо локальний Gradle Wrapper всередині згенерованого проекту перед збіркою
    - name: Force Gradle Wrapper Version
      run: |
        cd build_tmp/platforms/android
        # Примусово даємо команду локальному проекту перейти на Gradle 8.7
        gradle wrapper --gradle-version 8.7

    # 4. Запускаємо збірку з явним ігноруванням системних налаштувань, якщо вони десь проскочать
    - name: Build Android APK and AAB
      run: |
        cd build_tmp
        # Збірка APK
        cordova build android --device -- --gradleArg=-Dorg.gradle.java.home=$JAVA_HOME_17_X64
        # Збірка AAB (App Bundle) для Google Play
        cordova build android --release --device -- --packageType=bundle --gradleArg=-Dorg.gradle.java.home=$JAVA_HOME_17_X64

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-APK
        path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-AAB
        path: build_tmp/platforms/android/app/build/outputs/bundle/release/app-release.aab
