- name: Build APK with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Початок компіляції Gradle..."
          
          if [ -f "app.zip" ]; then
            unzip -q app.zip -d build_workspace/
            cd build_workspace/* || cd build_workspace
          else
            echo "Помилка: app.zip не знайдено!"
            exit 1
          }

          # Надання прав на виконання Gradle
          chmod +x gradlew
          
          # Запуск збірки релізного APK
          ./gradlew assembleRelease

          # Пошук зкомпільованого APK та копіювання у папку output
          mkdir -p ../output
          find . -name "*.apk" -exec cp {} ../output/ app-release.apk \;
          cd ..

          # Створення GitHub Release та завантаження файлу
          TAG="v1.0.$(date +%s)"
          gh release create "$TAG" output/*.apk \
            --title "APK Збірка від $(date +'%Y-%m-%d %H:%M')" \
            --notes "Автоматично зкомпільований APK через Gradle."
          
          echo "Збірку успішно завершено!"
