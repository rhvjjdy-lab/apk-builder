name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Потрібно для створення релізу та завантаження файлу
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Prepare Project Files
        run: |
          mkdir -p www
          unzip -o app.zip -d www/
          npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create build_app com.myapp.game "${{ github.event.client_payload.app_name }}"
          cp -r www/* build_app/www/
          
          if [ -f "icon.png" ]; then
            cp icon.png build_app/www/icon.png
          fi
          
          cd build_app
          cordova platform add android

      - name: Build APK
        run: |
          cd build_app
          cordova build android --release --no-telemetry

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-${{ github.run_number }}
          name: '${{ github.event.client_payload.app_name }} v${{ github.run_number }}'
          files: build_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          body: 'Автоматично зкомпільований APK-файл вашої програми.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
