name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Назва додатка'
        required: true
        default: 'Моя Гра'
      package_id:
        description: 'ID пакету (наприклад, com.example.game)'
        required: true
        default: 'com.example.mygame'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Prepare extracted files
        run: |
          mkdir -p src_content
          if [ -f "app.zip" ]; then
            unzip -o app.zip -d src_content/
          else
            echo "Файл app.zip не знайдено!"
            exit 1
          fi

      - name: Create Cordova Project & Configure
        run: |
          cordova create build_tmp "${{ github.event.inputs.package_id }}" "${{ github.event.inputs.app_name }}"
          cd build_tmp
          cordova platform add android
          
          # Очищаємо дефолтний шаблон та копіюємо файли користувача
          rm -rf www/*
          cp -r ../src_content/* www/
          
          # Якщо в корені репозиторію є завантажена іконка icon.png, підставляємо її
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
          fi

      - name: Build Android APK (Debug)
        run: |
          cd build_tmp
          cordova build android --device

      - name: Upload APK to Releases or Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: 'build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk'
          tag_name: "v1.0.${{ github.run_number }}"
          name: "APK збірка (#${{ github.run_number }}) - ${{ github.event.inputs.app_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
