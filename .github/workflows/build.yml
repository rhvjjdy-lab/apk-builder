name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate APK via PWABuilder
        run: |
          npx @pwabuilder/cli generate --manifest https://rhvjjdy-lab.github.io/apk-builder/manifest.json --platforms android --out ./output

      - uses: softprops/action-gh-release@v1
        with:
          files: './output/**/*.apk'
          tag_name: "v1.0.${{ github.run_number }}"
          name: "APK збірка (#${{ github.run_number }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
