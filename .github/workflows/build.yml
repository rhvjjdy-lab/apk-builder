name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built Android package
        run: |
          mkdir -p ./output
          curl -L -o ./output/app.apk "https://github.com/rhvjjdy-lab/apk-builder/raw/main/app.apk" || echo "Creating placeholder"
          # Якщо файл не знайдено в репозиторії, створимо базову заповнювальну структуру або завантажимо через curl
          # Давайте використаємо пряме звернення до генератора PWABuilder через API
          curl -X POST "https://pwabuilder-android-generator.azurewebsites.net/generateZip" \
            -H "Content-Type: application/json" \
            -d '{"name":"App","shortName":"App","packageId":"com.rhvjjdy.apkbuilder","version":"1.0.0","webManifestUrl":"https://rhvjjdy-lab.github.io/apk-builder/manifest.json","icons":[]}' \
            --output result.zip
          unzip -o result.zip -d ./android_files || true

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            ./output/**/*.apk
            ./result.zip
          tag_name: "v1.0.${{ github.run_number }}"
          name: "APK збірка (#${{ github.run_number }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
