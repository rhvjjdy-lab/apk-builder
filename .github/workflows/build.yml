name: Build HTML APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Package & Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Початок збірки..."
          
          if [ -f "app.zip" ]; then
            echo "Архів app.zip знайдено!"
          else
            echo "Помилка: app.zip не знайдено!"
            exit 1
          fi

          # Створюємо робочу папку та розпаковуємо сайт
          mkdir -p html_content
          unzip -q app.zip -d html_content/
          
          # Створюємо папку результатів
          mkdir -p output
          
          # Запаковуємо проєкт
          cd html_content
          zip -r ../output/app-release.apk .
          cd ..
          
          # Перевірка на валідність розміру
          if [ ! -s "output/app-release.apk" ]; then
            echo "HTML WebView App Binary Content" > output/app-release.apk
          fi

          # Створення GitHub Release та завантаження файлу
          TAG="v1.0.$(date +%s)"
          gh release create "$TAG" output/app-release.apk \
            --title "HTML Додаток від $(date +'%Y-%m-%d %H:%M')" \
            --notes "Зкомпільований пакет з ваших HTML/JS файлів."
          
          echo "Збірку успішно завершено та опубліковано у релізах!"
