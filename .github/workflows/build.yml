name: Build APK and AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Назва додатка'
        required: true
        default: 'Моя Гра'
      package_id:
        description: 'Package ID (напр. com.author.game)'
        required: true
        default: 'com.mycompany.mygame'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Cordova globally
        run: npm install -g cordova@11.1.0

      - name: Create Project and Build Directly
        run: |
          # 1. Створюємо проєкт
          cordova create my-app ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd my-app
          
          # 2. Додаємо Android платформу
          cordova platform add android@10.1.2
          
          # 3. Наповнюємо грою
          cd www
          rm -rf *
          unzip ../../app.zip -d .
          cd ..
          
          # 4. Іконка (якщо є)
          if [ -f "../icon.png" ]; then
            mkdir -p platforms/android/app/src/main/res/mipmap
            cp ../icon.png platforms/android/app/src/main/res/mipmap/icon.png || true
          fi
          
          # 5. Конфігурація
          sed -i 's/id="[^"]*"/id="${{ github.event.inputs.package_id }}"/g' config.xml
          sed -i 's/version="[^"]*"/version="${{ github.event.inputs.version_name }}"/g' config.xml
          sed -i '/<widget /a \    <preference name="android-versionCode" value="${{ github.event.inputs.version_code }}" />' config.xml

          # 6. Збираємо через стандартну команду Cordova (вона сама підтягне і налаштує всередині те, що потрібно)
          cordova build android --release
          cordova build android --release -- --bundle

      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Bundles
          path: |
            my-app/platforms/android/app/build/outputs/apk/release/app-release.apk
            my-app/platforms/android/app/build/outputs/bundle/release/app-release.aab
