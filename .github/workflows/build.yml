name: Build APK via PWABuilder

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate APK via PWABuilder
        uses: pwa-builder/pwabuilder-android-action@v1.7
        with:
          site-url: 'https://rhvjjdy-lab.github.io/apk-builder/'
          output-type: 'apk'

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.apk
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Автоматичний APK від PWABuilder (#${{ github.run_number }})"
          notes: "Згенеровано автоматично через офіційний хмарний екшен PWABuilder."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
