name: Build Android APK and AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform to Cordova
        run: npx cordova platform add android

      - name: Build Android APK
        run: npx cordova build android --release
        # Verification: перевіряє створення APK файлу у вихідній директорії Android проєкту.

      - name: Build Android AAB (Bundle)
        run: npx cordova build android --release --packageType=bundle
        # Verification: перевіряє створення AAB пакету для Google Play Store без перезапуску з нуля.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
