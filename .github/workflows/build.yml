name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Prepare Project Files
        run: |
          mkdir -p www
          echo "${{ github.event.client_payload.zip_base64 }}" | base64 -d > app.zip
          unzip -o app.zip -d www/
          npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create build_app com.myapp.game "${{ github.event.client_payload.app_name }}"
          cp -r www/* build_app/www/
          cd build_app
          cordova platform add android

      - name: Build APK
        run: |
          cd build_app
          cordova build android --release --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.client_payload.app_name }}-release
          path: build_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
