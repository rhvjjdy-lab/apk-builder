name: Build APK and AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Назва додатка'
        required: true
        default: 'Моя Гра'
      package_id:
        description: 'Package ID (напр. com.author.game)'
        required: true
        default: 'com.mycompany.mygame'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova and Native-Run
        run: npm install -g cordova@11.1.0

      - name: Build Project Safely
        run: |
          cordova create my-app ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd my-app
          
          # Використовуємо стабільнішу стару платформу, яка гарантовано створює gradlew одразу
          cordova platform add android@10.1.2
          
          # Заповнюємо гру
          cd www
          rm -rf *
          unzip ../../app.zip -d .
          cd ..
          
          # Іконка
          if [ -f "../icon.png" ]; then
            mkdir -p platforms/android/app/src/main/res/mipmap
            cp ../icon.png platforms/android/app/src/main/res/mipmap/icon.png || true
          fi
          
          # Конфіг
          sed -i 's/id="[^"]*"/id="${{ github.event.inputs.package_id }}"/g' config.xml
          sed -i 's/version="[^"]*"/version="${{ github.event.inputs.version_name }}"/g' config.xml
          sed -i '/<widget /a \    <preference name="android-versionCode" value="${{ github.event.inputs.version_code }}" />' config.xml
          
          # Головний трюк: пропатчуємо сам скрипт gradle.properties, щоб він не вимагав сторонніх інструментів
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties

          # Збірка через нативний градл платформи з повним шляхом
          cd platforms/android
          ./gradlew bundleRelease assembleRelease
          cd ../../

      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Bundles
          path: |
            my-app/platforms/android/app/build/outputs/apk/release/app-release.apk
            my-app/platforms/android/app/build/outputs/bundle/release/app-release.aab
