name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @pwabuilder/cli

      - run: pwabuilder package --webManifestUrl https://rhvjjdy-lab.github.io/apk-builder/manifest.json --platforms android

      - uses: softprops/action-gh-release@v1
        with:
          files: '**/*.apk'
          tag_name: "v1.0.${{ github.run_number }}"
          name: "APK збірка (#${{ github.run_number }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
