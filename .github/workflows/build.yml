name: Build APK and AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Назва додатка'
        required: true
        default: 'Моя Гра'
      package_id:
        description: 'Package ID (напр. com.author.game)'
        required: true
        default: 'com.mycompany.mygame'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova globally
        run: npm install -g cordova@12.0.0

      - name: Create Cordova Project
        run: |
          cordova create my-app ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd my-app
          cordova platform add android@12.0.0

      - name: Force Gradle 8.5 for Compatibility
        run: |
          cd my-app/platforms/android
          # Змінюємо версію Gradle у gradle-wrapper.properties на сумісну 8.5
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Inject Web Game Files
        run: |
          cd my-app/www
          rm -rf *
          unzip ../../app.zip -d .
          
          if [ -f ../../icon.png ]; then
            mkdir -p ../res/icon/android
            cp ../../icon.png ../res/icon/android/icon.png
          fi

      - name: Configure App ID and Versions
        run: |
          cd my-app
          sed -i 's/id="[^"]*"/id="${{ github.event.inputs.package_id }}"/g' config.xml
          sed -i 's/version="[^"]*"/version="${{ github.event.inputs.version_name }}"/g' config.xml
          sed -i '/<widget /a \    <preference name="android-versionCode" value="${{ github.event.inputs.version_code }}" />' config.xml

      - name: Build APK and AAB (Release)
        run: |
          cd my-app
          cordova build android --release
          cordova build android --release -- --bundle

      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Bundles
          path: |
            my-app/platforms/android/app/build/outputs/apk/release/app-release.apk
            my-app/platforms/android/app/build/outputs/bundle/release/app-release.aab
