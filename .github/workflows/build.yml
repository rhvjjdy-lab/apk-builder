name: Build APK via PWABuilder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate Android Package
        run: pwabuilder package --webManifestUrl https://rhvjjdy-lab.github.io/apk-builder/manifest.json --platforms android --options '{"name": "App", "shortName": "App", "packageId": "com.rhvjjdy.apkbuilder", "version": "1.0.0", "sign": false}'

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: '**/*.apk'
          tag_name: "v1.0.${{ github.run_number }}"
          name: "APK збірка (#${{ github.run_number }})"
          notes: "Автоматично згенеровано через PWABuilder CLI."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
